<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Shift Calendar: Import &amp; Plan — App Video</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { display: grid; place-items: center; overflow: hidden; }
    video { display: block; width: 100%; height: 100vh; height: 100dvh; object-fit: contain; }
    #play { position: fixed; inset: 0; margin: auto; width: max-content; height: max-content;
      padding: 14px 24px; border: 1px solid #fff; border-radius: 28px; background: #111d;
      color: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer; }
    #play[hidden] { display: none; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline webkit-playsinline controls loop preload="auto"
    aria-label="Shift Calendar: Import &amp; Plan app demonstration">
    <source src="use.mp4" type="video/mp4">
    Your browser does not support HTML video. <a href="use.mp4">Download the video</a>.
  </video>
  <button id="play" type="button" hidden>Play video</button>
  <script>
    const video = document.getElementById('video');
    const play = document.getElementById('play');
    video.muted = true;
    video.defaultMuted = true;
    function start() {
      video.play().catch(() => { play.hidden = false; });
    }
    video.addEventListener('playing', () => { play.hidden = true; });
    play.addEventListener('click', start);
    start();
  </script>
</body>
</html>
